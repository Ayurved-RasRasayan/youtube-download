name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test and Lint
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: |
        cd server
        npm ci

    - name: Check syntax
      run: |
        cd server
        node --check server.js

    - name: Start server and run health check
      run: |
        cd server
        node server.js &
        sleep 3
        curl -f http://localhost:3000/api/health || exit 1
        kill %1

  # Job 2: Deploy (only on main branch push)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: |
        cd server
        npm ci --production

    - name: Create deployment package
      run: |
        cd ..
        zip -r youtube-downloader-deploy.zip \
          youtube-downloader/server/ \
          youtube-downloader/public/ \
          youtube-downloader/.gitignore \
          youtube-downloader/LICENSE \
          youtube-downloader/README.md \
          youtube-downloader/setup.sh \
          -x "*.log" "node_modules/*"

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: youtube-downloader-deploy
        path: youtube-downloader-deploy.zip
        retention-days: 30

  # Job 3: Release (optional - on tags)
  release:
    needs: deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          youtube-downloader-deploy.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
