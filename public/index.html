<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Channel Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-title {
            font-size: 1.5em;
            color: #333;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
        }

        .stat-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .stat-new { background: #e3f2fd; color: #1976d2; }
        .stat-downloaded { background: #e8f5e9; color: #388e3c; }
        .stat-total { background: #fff3e0; color: #f57c00; }

        /* Channel Input Section */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Video List */
        .video-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .video-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #fafafa;
            transition: all 0.3s;
        }

        .video-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .video-item.downloading {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .video-item.completed {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .video-item.skipped {
            background: #fff3e0;
            border-color: #ff9800;
        }

        .video-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-meta {
            font-size: 0.85em;
            color: #666;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Status Badges */
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-downloaded { background: #e8f5e9; color: #388e3c; }
        .status-downloading { background: #e3f2fd; color: #1976d2; animation: pulse 2s infinite; }
        .status-completed { background: #e8f5e9; color: #388e3c; }
        .status-skipped { background: #fff3e0; color: #f57c00; }
        .status-error { background: #ffebee; color: #d32f2f; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Progress Bar */
        .progress-container {
            width: 150px;
            margin: 0 15px;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75em;
            color: #666;
            text-align: center;
            margin-top: 3px;
        }

        /* Action Buttons */
        .video-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        /* Batch Actions */
        .batch-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .batch-info {
            font-size: 0.9em;
            color: #666;
        }

        /* Download Queue */
        .queue-section {
            margin-top: 30px;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Alert Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.show { display: block; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .video-item { flex-wrap: wrap; }
            .progress-container { width: 100%; margin: 10px 0; order: 3; }
            .video-actions { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube Channel Downloader</h1>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Channel Input -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Load Channel</h2>
            </div>
            
            <div class="input-group">
                <input type="text" id="channelInput" placeholder="Enter channel URL or @username (e.g., @kayakalp-i9z)">
                <button class="btn-primary" onclick="loadChannel()" id="loadBtn">Load Channel</button>
            </div>
        </div>

        <!-- Videos List -->
        <div class="card" id="videosCard" style="display: none;">
            <div class="card-header">
                <h2 class="card-title">Videos</h2>
                <div class="stats" id="channelStats">
                    <span class="stat-badge stat-total">Total: 0</span>
                    <span class="stat-badge stat-new">New: 0</span>
                    <span class="stat-badge stat-downloaded">Downloaded: 0</span>
                </div>
            </div>

            <div class="video-list" id="videoList">
                <!-- Videos will be loaded here -->
            </div>

            <div class="batch-actions">
                <div class="batch-info">
                    <label><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> Select All</label>
                    <span id="selectedCount">0 selected</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-success btn-small" onclick="downloadSelected()" id="downloadSelectedBtn" disabled>
                        ⬇️ Download Selected
                    </button>
                    <button class="btn-primary btn-small" onclick="downloadNewOnly()" id="downloadNewBtn" disabled>
                        ✨ Download New Only
                    </button>
                    <button class="btn-danger btn-small" onclick="clearCompleted()">
                        🗑️ Clear Completed
                    </button>
                </div>
            </div>
        </div>

        <!-- Download Queue -->
        <div class="card queue-section" id="queueCard" style="display: none;">
            <div class="card-header">
                <h2 class="card-title">Download Queue</h2>
                <button class="btn-secondary btn-small" onclick="refreshQueue()">Refresh</button>
            </div>
            <div id="queueList"></div>
        </div>
    </div>

    <script>
        // Global state
        let currentChannel = null;
        let videos = [];
        let selectedVideos = new Set();
        let pollingInterval = null;

        // API Base URL
        const API_BASE = '';

        // Show alert message
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.className = `alert show alert-${type}`;
            alert.textContent = message;
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Load channel from YouTube
        async function loadChannel() {
            const input = document.getElementById('channelInput').value.trim();
            if (!input) {
                showAlert('Please enter a channel URL or username', 'warning');
                return;
            }

            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Loading...';

            try {
                // Determine if it's a URL or username
                const url = input.startsWith('http') ? input : `https://www.youtube.com/${input}`;
                
                const response = await fetch(`${API_BASE}/api/channels`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load channel');
                }

                currentChannel = data.channel;
                videos = data.videos || [];
                
                renderVideos();
                updateStats();
                
                document.getElementById('videosCard').style.display = 'block';
                showAlert(`Loaded ${videos.length} videos from channel`, 'success');

                // Start polling for download status
                startPolling();

            } catch (error) {
                console.error('Error loading channel:', error);
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Load Channel';
            }
        }

        // Render video list with status badges
        function renderVideos() {
            const container = document.getElementById('videoList');
            
            if (videos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No videos found</p>';
                return;
            }

            container.innerHTML = videos.map((video, index) => `
                <div class="video-item ${getVideoClass(video)}" data-index="${index}" id="video-${index}">
                    <input type="checkbox" 
                           class="video-checkbox" 
                           ${selectedVideos.has(index) ? 'checked' : ''}
                           ${video.downloadStatus === 'downloaded' ? 'disabled' : ''}
                           onchange="toggleVideo(${index})">
                    
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="video-meta">
                            <span class="status-badge status-${video.downloadStatus}">
                                ${getStatusIcon(video.downloadStatus)} ${video.downloadStatus}
                            </span>
                            ${video.duration ? `<span>⏱️ ${formatDuration(video.duration)}</span>` : ''}
                            ${video.views && video.views !== 'NA' ? `<span>👁️ ${formatNumber(video.views)}` : ''}
                            ${video.fileSize ? `<span>📦 ${video.fileSize}MB</span>` : ''}
                        </div>
                    </div>

                    <div class="progress-container" id="progress-${index}" style="${video.downloadStatus !== 'downloading' ? 'display:none' : ''}">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${video.progress || 0}%"></div>
                        </div>
                        <div class="progress-text">${video.progress || 0}%</div>
                    </div>

                    <div class="video-actions">
                        ${video.downloadStatus === 'new' ? `
                            <button class="btn-primary btn-small" onclick="downloadVideo(${index})">
                                ⬇️ Download
                            </button>
                        ` : video.downloadStatus === 'downloaded' ? `
                            <span style="color: #388e3c; font-size: 0.9em;">✅ Done</span>
                        ` : video.downloadStatus === 'downloading' ? `
                            <span class="status-badge status-downloading">
                                <span class="spinner"></span>Downloading
                            </span>
                        ` : video.downloadStatus === 'skipped' ? `
                            <span style="color: #f57c00; font-size: 0.9em;">⏭️ Skipped</span>
                        ` : `
                            <button class="btn-primary btn-small" onclick="downloadVideo(${index})">
                                ⬇️ Retry
                            </button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        // Get CSS class based on video status
        function getVideoClass(video) {
            switch (video.downloadStatus) {
                case 'downloading': return 'downloading';
                case 'completed':
                case 'downloaded': return 'completed';
                case 'skipped': return 'skipped';
                default: return '';
            }
        }

        // Get status icon
        function getStatusIcon(status) {
            switch (status) {
                case 'new': return '✨';
                case 'downloaded': return '✅';
                case 'downloading': return '⬇️';
                case 'completed': return '✅';
                case 'skipped': return '⏭️';
                case 'error': return '❌';
                default: return '❓';
            }
        }

        // Update statistics display
        function updateStats() {
            const total = videos.length;
            const downloaded = videos.filter(v => v.downloadStatus === 'downloaded').length;
            const newCount = videos.filter(v => v.downloadStatus === 'new').length;

            document.getElementById('channelStats').innerHTML = `
                <span class="stat-badge stat-total">Total: ${total}</span>
                <span class="stat-badge stat-new">New: ${newCount}</span>
                <span class="stat-badge stat-downloaded">Downloaded: ${downloaded}</span>
            `;
        }

        // Toggle video selection
        function toggleVideo(index) {
            if (selectedVideos.has(index)) {
                selectedVideos.delete(index);
            } else {
                selectedVideos.add(index);
            }
            updateSelectedCount();
        }

        // Toggle select all
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            videos.forEach((video, index) => {
                if (video.downloadStatus !== 'downloaded') {
                    if (selectAll.checked) {
                        selectedVideos.add(index);
                    } else {
                        selectedVideos.delete(index);
                    }
                }
            });
            renderVideos();
            updateSelectedCount();
        }

        // Update selected count
        function updateSelectedCount() {
            const count = selectedVideos.size;
            document.getElementById('selectedCount').textContent = `${count} selected`;
            document.getElementById('downloadSelectedBtn').disabled = count === 0;
            document.getElementById('downloadNewBtn').disabled = count === 0;
        }

        // Download single video
        async function downloadVideo(index) {
            const video = videos[index];
            
            // Update UI immediately
            video.downloadStatus = 'downloading';
            video.progress = 0;
            renderVideos();

            try {
                const response = await fetch(`${API_BASE}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        videoId: video.id || video.videoId,
                        title: video.title,
                        channelId: currentChannel?.id,
                        format: 'best',
                        quality: 'lowest'
                    })
                });

                const result = await response.json();

                if (result.status === 'skipped') {
                    video.downloadStatus = 'skipped';
                    video.skipReason = result.download?.reason;
                    showAlert(`${video.title} - Already exists, skipped`, 'warning');
                } else if (result.success) {
                    // Will be updated by polling
                    video.jobId = result.jobId;
                    showAlert(`Started downloading: ${video.title}`, 'info');
                } else {
                    throw new Error(result.error || 'Download failed');
                }

                renderVideos();

            } catch (error) {
                video.downloadStatus = 'error';
                video.error = error.message;
                renderVideos();
                showAlert(`Error downloading: ${error.message}`, 'error');
            }
        }

        // Download selected videos
        async function downloadSelected() {
            if (selectedVideos.size === 0) {
                showAlert('No videos selected', 'warning');
                return;
            }

            const selectedIndices = Array.from(selectedVideos);
            let successCount = 0;
            let skipCount = 0;

            for (const index of selectedIndices) {
                const video = videos[index];
                
                if (video.downloadStatus === 'downloaded') {
                    skipCount++;
                    continue;
                }

                await downloadVideo(index);
                successCount++;

                // Small delay between downloads to avoid overwhelming the server
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            if (skipCount > 0) {
                showAlert(`Started ${successCount} downloads, skipped ${skipCount} already downloaded`, 'info');
            } else {
                showAlert(`Started ${successCount} downloads`, 'success');
            }

            selectedVideos.clear();
            updateSelectedCount();
        }

        // Download only new (not yet downloaded) videos
        async function downloadNewOnly() {
            // Auto-select all new videos
            selectedVideos.clear();
            videos.forEach((video, index) => {
                if (video.downloadStatus === 'new') {
                    selectedVideos.add(index);
                }
            });

            renderVideos();
            updateSelectedCount();

            if (selectedVideos.size > 0) {
                await downloadSelected();
            } else {
                showAlert('No new videos to download', 'info');
            }
        }

        // Start polling for download status
        function startPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            // Poll every 2 seconds
            pollingInterval = setInterval(async () => {
                await refreshQueue();
                updateVideoProgress();
            }, 2000);
        }

        // Refresh download queue from server
        async function refreshQueue() {
            try {
                const response = await fetch(`${API_BASE}/api/download-queue`);
                const data = await response.json();

                if (data.success) {
                    renderQueue(data.queue);
                    document.getElementById('queueCard').style.display = 
                        (data.stats.active > 0 || data.stats.completed > 0) ? 'block' : 'none';
                }
            } catch (error) {
                console.error('Error refreshing queue:', error);
            }
        }

        // Render download queue
        function renderQueue(queue) {
            const container = document.getElementById('queueList');
            
            const items = [
                ...(queue.active || []),
                ...(queue.completed || []).slice(-5),
                ...(queue.failed || []).slice(-3)
            ];

            if (items.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No downloads in queue</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="queue-item">
                    <div>
                        <strong>${escapeHtml(item.filename || item.url)}</strong>
                        <div style="font-size: 0.85em; color: #666;">
                            <span class="status-badge status-${item.status}">${item.status}</span>
                            ${item.progress != null ? `${item.progress}%` : ''}
                        </div>
                    </div>
                    <div style="font-size: 0.85em; color: #666;">
                        ${item.speed ? `@ ${item.speed}` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Update video progress from local state
        function updateVideoProgress() {
            let hasChanges = false;

            videos.forEach((video, index) => {
                if (video.downloadStatus === 'downloading') {
                    const progressEl = document.querySelector(`#progress-${index} .progress-fill`);
                    const progressText = document.querySelector(`#progress-${index} .progress-text`);
                    
                    if (progressEl && video.progress !== undefined) {
                        progressEl.style.width = `${video.progress}%`;
                        if (progressText) {
                            progressText.textContent = `${video.progress}%`;
                        }
                    }
                }
            });

            if (hasChanges) {
                // Re-render if any significant changes
                const anyDownloading = videos.some(v => v.downloadStatus === 'downloading');
                if (anyDownloading) {
                    // Just update progress bars, don't full re-render
                }
            }
        }

        // Clear completed downloads from view
        function clearCompleted() {
            // This would need a backend endpoint to clear history
            showAlert('Queue cleared', 'info');
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 'NA') return '';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatNumber(num) {
            if (!num || num === 'NA') return '';
            num = parseInt(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Check for existing channels
            fetchChannels();
        });

        // Fetch saved channels on startup
        async function fetchChannels() {
            try {
                const response = await fetch(`${API_BASE}/api/channels`);
                const data = await response.json();

                if (data.channels && data.channels.length > 0) {
                    // Load first channel automatically
                    currentChannel = data.channels[0];
                    videos = currentChannel.videos || [];
                    renderVideos();
                    updateStats();
                    document.getElementById('videosCard').style.display = 'block';
                    
                    // Set input value
                    document.getElementById('channelInput').value = currentChannel.url || currentChannel.youtubeId;
                }
            } catch (error) {
                console.log('No saved channels found');
            }
        }

        // Handle Enter key in input
        document.getElementById('channelInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadChannel();
            }
        });
    </script>
</body>
</html>
